# Reconstruit les calendriers et résultats toutes les 3 heures et les publie sur GitHub Pages.
name: Calendriers et résultats

on:
  schedule:
    - cron: "17 */3 * * *" # toutes les 3 h (minute 17 pour éviter les heures pleines, très chargées)
  workflow_dispatch: {} # bouton "Run workflow" pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node src/build.js --out public
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
