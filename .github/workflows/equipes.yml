# Une fois par semaine : relit la liste des clubs de chaque championnat (D1)
# pour l'écran « Mes équipes » du jeu (environ 170 requêtes API-Football).
# Le fichier est gardé dans le dépôt (static/teams.json) puis publié sur
# GitHub Pages par le workflow « Calendriers et résultats ».
name: Équipes

on:
  schedule:
    - cron: "41 4 * * 1" # le lundi à 4 h 41 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # relancer la publication Pages

concurrency:
  group: equipes
  cancel-in-progress: false

jobs:
  teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/teams.js --out static/teams.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Enregistrer la liste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add static/teams.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Équipes : liste des clubs mise à jour"
          git push
      - name: Republier GitHub Pages
        run: gh workflow run daily.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
